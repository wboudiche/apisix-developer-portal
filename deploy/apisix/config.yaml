nginx_config:
  # Single worker so limit-count's default policy:local keeps one shared counter.
  # Multiple workers each hold an independent local counter, which makes
  # per-window rate limits non-deterministic (a concern for tests and small
  # single-node dev/test deploys). One worker is plenty for the dev stack.
  worker_processes: 1
apisix:
  node_listen: 9080
  enable_admin: true
deployment:
  admin:
    admin_key:
      - name: admin
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin
    allow_admin:
      - 0.0.0.0/0
  etcd:
    host:
      - "http://etcd:2379"
    prefix: /apisix
    timeout: 30
