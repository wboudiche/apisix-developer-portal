name: apisix-portal
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd:
    image: bitnamilegacy/etcd:3.5
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
    # No host port mapping: APISIX reaches etcd internally as http://etcd:2379.

  apisix:
    image: apache/apisix:3.9.1-debian
    depends_on: [etcd]
    volumes:
      - ./deploy/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "9080:9080"
      - "127.0.0.1:19180:9180"

  echo:
    image: mendhak/http-https-echo:31
    environment:
      HTTP_PORT: "8080"

  prometheus:
    image: prom/prometheus:v2.54.1
    depends_on: [apisix]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Loopback-only: the host-run portal queries it at localhost:9099; never
    # exposed off-box (same posture as the admin/DB ports). Host 9090 is left
    # for other local stacks; container still listens on 9090.
    ports: ["127.0.0.1:9099:9090"]
