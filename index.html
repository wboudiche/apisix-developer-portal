<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas — Portail Développeur · Catalogue d'API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        oklch(98.5% 0.004 255);
    --surface:   oklch(100% 0 0);
    --ink:       oklch(27% 0.105 27);
    --ink-soft:  oklch(34% 0.115 27);
    --ink-line:  oklch(45% 0.10 27);
    --fg:        oklch(25% 0.02 262);
    --muted:     oklch(53% 0.015 262);
    --faint:     oklch(67% 0.012 262);
    --border:    oklch(91% 0.006 262);
    --border-2:  oklch(86% 0.008 262);
    --accent:    oklch(55% 0.205 27);
    --accent-d:  oklch(47% 0.19 27);
    --accent-soft: oklch(95% 0.04 27);
    --warn:      oklch(74% 0.15 78);

    --c-admin:   oklch(56% 0.035 262);
    --c-finance: oklch(54% 0.09 158);
    --c-marketing: oklch(64% 0.135 55);
    --c-eng:     oklch(55% 0.11 288);

    --r: 14px;
    --shadow: 0 1px 2px oklch(24% 0.03 262 / .05), 0 8px 24px oklch(24% 0.03 262 / .06);
    --shadow-h: 0 2px 4px oklch(24% 0.03 262 / .07), 0 16px 40px oklch(24% 0.03 262 / .12);
    --topbar-h: 62px;
    --rail-w: 270px;
    --font-display:'Bricolage Grotesque',-apple-system,system-ui,sans-serif;
    --font-body:'IBM Plex Sans',-apple-system,system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--fg);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    line-height:1.5;
  }
  ::selection{background:var(--accent-soft)}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}

  /* ===================== TOP BAR ===================== */
  .topbar{
    position:sticky;top:0;z-index:60;
    height:var(--topbar-h);
    background:color-mix(in oklab,var(--surface) 86%, transparent);
    backdrop-filter:saturate(1.4) blur(14px);
    -webkit-backdrop-filter:saturate(1.4) blur(14px);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:22px;
    padding:0 22px;
  }
  .brand{display:flex;align-items:center;gap:11px;flex:none}
  .brand .mark{
    width:34px;height:34px;border-radius:9px;flex:none;
    background:linear-gradient(145deg,var(--accent),var(--accent-d));
    display:grid;place-items:center;color:#fff;
    box-shadow:0 4px 12px oklch(55% 0.205 27 /.35);
  }
  .brand .mark svg{width:19px;height:19px}
  .brand .name{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1}
  .brand .sub{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}

  .nav-tabs{display:flex;gap:2px;margin-left:6px}
  .nav-tabs a{
    padding:8px 14px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);
    display:flex;align-items:center;gap:7px;transition:.15s;
  }
  .nav-tabs a svg{width:16px;height:16px;opacity:.8}
  .nav-tabs a:hover{color:var(--fg);background:oklch(96% 0.004 262)}
  .nav-tabs a.active{color:var(--accent);background:var(--accent-soft)}

  .search{
    margin-left:auto;position:relative;flex:1;max-width:420px;min-width:140px;
  }
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint);pointer-events:none}
  .search input{
    width:100%;height:40px;border:1px solid var(--border-2);border-radius:11px;
    background:var(--bg);padding:0 14px 0 40px;font-size:14px;font-family:inherit;color:var(--fg);
    transition:.18s;
  }
  .search input::placeholder{color:var(--faint)}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
  .search kbd{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-family:var(--font-mono);font-size:11px;color:var(--faint);
    border:1px solid var(--border-2);border-radius:6px;padding:2px 6px;background:var(--surface);
  }

  .topbar .icon-btn{
    width:38px;height:38px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface);
    display:grid;place-items:center;color:var(--muted);flex:none;transition:.15s;
  }
  .topbar .icon-btn:hover{color:var(--fg);border-color:var(--accent);background:var(--accent-soft)}
  .topbar .icon-btn svg{width:18px;height:18px}
  .user{display:flex;align-items:center;gap:9px;flex:none;padding-left:6px}
  .user .av{
    width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--c-eng),var(--accent));color:#fff;font-weight:600;font-size:13px;
    font-family:var(--font-display);
  }
  .user .who{font-size:13px;font-weight:500;line-height:1.2}
  .user .who small{display:block;color:var(--muted);font-size:11px;font-weight:400}
  .hamb{display:none}

  /* ===================== LAYOUT ===================== */
  .layout{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:calc(100vh - var(--topbar-h))}

  /* ===================== SIDEBAR ===================== */
  .rail{
    background:var(--ink);color:oklch(88% 0.01 262);
    padding:26px 18px 40px;
    position:sticky;top:var(--topbar-h);height:calc(100vh - var(--topbar-h));overflow-y:auto;
  }
  .rail-head{display:flex;align-items:center;justify-content:space-between;margin:0 6px 16px}
  .rail-head h2{font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:oklch(72% 0.02 262)}
  .rail-head .collapse{width:26px;height:26px;border-radius:7px;border:1px solid var(--ink-line);background:transparent;color:oklch(70% 0.02 262);display:grid;place-items:center}
  .rail-head .collapse:hover{background:var(--ink-soft)}
  .rail-head .collapse svg{width:14px;height:14px}

  .cat{
    width:100%;display:flex;align-items:center;gap:11px;
    padding:9px 11px;border-radius:10px;border:0;background:transparent;
    color:oklch(85% 0.01 262);font-size:14px;text-align:left;transition:.14s;margin-bottom:2px;
    position:relative;
  }
  .cat:hover{background:var(--ink-soft)}
  .cat .dot{width:9px;height:9px;border-radius:3px;flex:none}
  .cat .clabel{flex:1;font-weight:500}
  .cat .cnt{font-family:var(--font-mono);font-size:12px;color:oklch(82% 0.04 27);background:oklch(33% 0.075 27);padding:1px 8px;border-radius:20px}
  .cat.active{background:var(--ink-soft);color:#fff}
  .cat.active::before{content:"";position:absolute;left:-18px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  .cat.active .cnt{background:var(--accent);color:#fff}

  .rail-sec{font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:oklch(72% 0.02 262);margin:26px 6px 13px}
  .tags{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px}
  .tag{
    font-size:13px;padding:5px 11px;border-radius:20px;border:1px solid var(--ink-line);
    background:transparent;color:oklch(80% 0.01 262);transition:.14s;
  }
  .tag:hover{border-color:var(--accent);color:#fff}
  .tag.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .tag::before{content:"#";opacity:.5;margin-right:1px}

  .rail-note{margin:28px 6px 0;font-size:12px;color:oklch(60% 0.02 262);line-height:1.5;border-top:1px solid var(--ink-line);padding-top:16px}

  /* ===================== CONTENT ===================== */
  .content{padding:30px 34px 60px;min-width:0}
  .chead{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:24px}
  .chead .titlewrap{flex:1;min-width:200px}
  .chead h1{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
  .chead h1 .gear{width:30px;height:30px;color:var(--accent)}
  .chead .rescount{color:var(--muted);font-size:14px;margin-top:5px}
  .chead .rescount b{color:var(--fg);font-variant-numeric:tabular-nums}

  .controls{display:flex;align-items:center;gap:10px}
  .sortwrap{position:relative}
  .sortwrap label{font-size:12px;color:var(--muted);margin-right:7px}
  select.sort{
    appearance:none;font-family:inherit;font-size:13px;color:var(--fg);font-weight:500;
    border:1px solid var(--border-2);border-radius:10px;background:var(--surface);
    padding:9px 32px 9px 13px;cursor:pointer;transition:.15s;
  }
  select.sort:hover{border-color:var(--accent)}
  select.sort:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .sortwrap .chev{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);pointer-events:none}

  .viewtog{display:flex;border:1px solid var(--border-2);border-radius:10px;overflow:hidden;background:var(--surface)}
  .viewtog button{width:38px;height:38px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;transition:.14s}
  .viewtog button svg{width:18px;height:18px}
  .viewtog button:hover{color:var(--fg)}
  .viewtog button.active{background:var(--accent-soft);color:var(--accent)}

  .activefilters{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:20px;min-height:1px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;
    background:var(--accent-soft);color:var(--accent-d);padding:5px 6px 5px 12px;border-radius:20px;
  }
  .chip button{border:0;background:oklch(55% 0.205 27 /.18);color:var(--accent-d);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:13px;line-height:1}
  .chip button:hover{background:var(--accent);color:#fff}
  .clearall{font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;text-underline-offset:3px}
  .clearall:hover{color:var(--accent)}

  /* ===================== GRID + CARDS ===================== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:20px}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    overflow:hidden;display:flex;flex-direction:column;transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s,border-color .22s;
    opacity:0;transform:translateY(14px);
  }
  .card.in{opacity:1;transform:none}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-h);border-color:var(--border-2)}

  .thumb{
    height:74px;position:relative;overflow:visible;display:grid;place-items:center;
    border-bottom:1px solid var(--border);
  }
  .thumb::before{ /* subtle grid texture */
    content:"";position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(var(--tint-line) 1px,transparent 1px),linear-gradient(90deg,var(--tint-line) 1px,transparent 1px);
    background-size:22px 22px;mask-image:radial-gradient(120% 120% at 80% 0%,#000,transparent 75%);
  }
  .thumb .ico{
    width:54px;height:54px;border-radius:14px;display:grid;place-items:center;color:#fff;
    position:absolute;bottom:7px;left:14px;z-index:2;box-shadow:0 10px 24px var(--tint-sh);
    background:linear-gradient(150deg,var(--tint),var(--tint-d));
    transition:transform .22s cubic-bezier(.2,.7,.3,1);
  }
  .card:hover .thumb .ico{transform:translateY(-3px) scale(1.04)}
  .thumb .ico svg{width:27px;height:27px}
  .thumb .catbadge{
    position:absolute;top:12px;right:12px;z-index:1;font-size:11px;font-weight:600;letter-spacing:.03em;
    padding:4px 9px;border-radius:20px;background:color-mix(in oklab,var(--surface) 78%,transparent);
    backdrop-filter:blur(6px);color:var(--tint-d);border:1px solid var(--border);
  }

  .cbody{padding:8px 17px 17px;display:flex;flex-direction:column;flex:1;gap:9px}
  .crow1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .cname{font-family:var(--font-display);font-size:17.5px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
  .stars{display:flex;gap:1.5px;flex:none;margin-top:3px}
  .stars svg{width:14px;height:14px}
  .star-f{color:var(--warn)} .star-e{color:var(--border-2)}
  .cdesc{font-size:13.5px;color:var(--muted);line-height:1.5;text-wrap:pretty;flex:1}
  .cmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--font-mono);font-size:12px}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;background:oklch(96% 0.004 262);border:1px solid var(--border);color:var(--muted)}
  .pill b{color:var(--fg);font-weight:600}
  .pill.ctx{color:var(--accent-d);background:var(--accent-soft);border-color:transparent}
  .cby{font-size:12.5px;color:var(--faint)}
  .cby b{color:var(--muted);font-weight:600}

  .cfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px;padding-top:13px;border-top:1px solid var(--border)}
  .ctags{display:flex;gap:6px;flex-wrap:wrap}
  .ctag{font-size:11.5px;color:var(--faint)}
  .ctag::before{content:"#";opacity:.5}
  .subbtn{
    flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
    border:1px solid var(--accent);color:var(--accent);background:transparent;padding:7px 13px;border-radius:9px;transition:.15s;
  }
  .subbtn svg{width:14px;height:14px}
  .subbtn:hover{background:var(--accent);color:#fff}
  .subbtn.on{background:var(--c-finance);border-color:var(--c-finance);color:#fff}
  .subbtn.on:hover{filter:brightness(.95)}

  /* list view */
  .grid.list{grid-template-columns:1fr;gap:12px}
  .grid.list .card{flex-direction:row;align-items:stretch}
  .grid.list .thumb{height:auto;width:130px;flex:none;border-bottom:0;border-right:1px solid var(--border)}
  .grid.list .thumb .ico{position:static;left:auto;top:auto;border:0;width:48px;height:48px;border-radius:12px}
  .grid.list .thumb .ico svg{width:24px;height:24px}
  .grid.list .thumb .catbadge{display:none}
  .grid.list .cbody{flex-direction:row;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 18px}
  .grid.list .crow1{flex-direction:column;gap:5px;min-width:180px;flex:1}
  .grid.list .cdesc{flex:2;min-width:200px}
  .grid.list .cmeta{flex:none}
  .grid.list .cfoot{border-top:0;padding-top:0;margin:0;flex:none}
  .grid.list .ctags{display:none}

  /* empty */
  .empty{text-align:center;padding:80px 20px;color:var(--muted);display:none}
  .empty.show{display:block}
  .empty svg{width:54px;height:54px;color:var(--border-2);margin-bottom:18px}
  .empty h3{font-family:var(--font-display);font-size:20px;color:var(--fg);margin-bottom:8px}
  .empty button{margin-top:18px;border:1px solid var(--accent);color:var(--accent);background:transparent;padding:9px 18px;border-radius:10px;font-weight:600}
  .empty button:hover{background:var(--accent);color:#fff}

  .overlay{display:none}

  /* ===================== RESPONSIVE ===================== */
  @media (max-width:1080px){.content{padding:26px 24px 50px}}
  @media (max-width:900px){
    :root{--rail-w:0px}
    .layout{grid-template-columns:1fr}
    .rail{
      position:fixed;top:0;left:0;height:100vh;width:280px;z-index:90;padding-top:24px;
      transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.7,.3,1);box-shadow:var(--shadow-h);
    }
    body.nav-open .rail{transform:none}
    body.nav-open .overlay{display:block;position:fixed;inset:0;background:oklch(20% 0.03 262 /.5);z-index:80;backdrop-filter:blur(2px)}
    .hamb{display:grid}
    .search{max-width:none}
    .brand .sub{display:none}
    .user .who{display:none}
    .nav-tabs{display:none}
  }
  @media (max-width:560px){
    .topbar{gap:12px;padding:0 14px}
    .search kbd{display:none}
    .content{padding:22px 16px 44px}
    .chead h1{font-size:25px}
    .grid{grid-template-columns:1fr;gap:14px}
    .grid.list .card{flex-direction:column}
    .grid.list .thumb{width:100%;height:96px;border-right:0;border-bottom:1px solid var(--border)}
    .grid.list .cbody{flex-direction:column;align-items:stretch}
    .controls .sortwrap label{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .card{opacity:1;transform:none;transition:none}
    *{scroll-behavior:auto}
  }
</style>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<header class="topbar">
  <button class="icon-btn hamb" id="hamb" aria-label="Ouvrir les catégories">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#">
    <span class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7l-3 5 3 5M19 7l3 5-3 5M14 4l-4 16" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span>
      <span class="name">Atlas</span>
      <span class="sub">Portail Développeur</span>
    </span>
  </a>
  <nav class="nav-tabs">
    <a href="#" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      APIs
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6a2 2 0 012-2h12a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M8 9h8M8 13h5" stroke-linecap="round"/></svg>
      Applications
    </a>
  </nav>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="Rechercher une API, un tag, un contexte…" aria-label="Rechercher" autocomplete="off">
    <kbd>/</kbd>
  </div>
  <button class="icon-btn" aria-label="Aide / Documentation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 113.5 2.3c-.8.4-1 .9-1 1.7M12 17h.01" stroke-linecap="round"/></svg>
  </button>
  <div class="user">
    <span class="av">AD</span>
    <span class="who">Admin<small>Espace développeur</small></span>
  </div>
</header>

<div class="layout">
  <!-- ============ SIDEBAR ============ -->
  <aside class="rail" id="rail">
    <div class="rail-head">
      <h2>Catégories d'API</h2>
      <button class="collapse" id="closeRail" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <nav id="cats"></nav>

    <div class="rail-sec">Tags</div>
    <div class="tags" id="tags"></div>

    <p class="rail-note">9 APIs publiées · sandbox &amp; production disponibles. Abonnez-vous pour générer vos clés.</p>
  </aside>

  <!-- ============ CONTENT ============ -->
  <main class="content">
    <div class="chead">
      <div class="titlewrap">
        <h1>
          <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M21 12h-2.5M5.5 12H3M18 6l-1.8 1.8M7.8 16.2L6 18M18 18l-1.8-1.8M7.8 7.8L6 6" stroke-linecap="round"/></svg>
          Catalogue d'API
        </h1>
        <p class="rescount" id="rescount"></p>
      </div>
      <div class="controls">
        <div class="sortwrap">
          <label for="sort">Trier</label>
          <select class="sort" id="sort">
            <option value="popular">Popularité</option>
            <option value="recent">Plus récentes</option>
            <option value="alpha">Alphabétique</option>
          </select>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="viewtog" role="group" aria-label="Affichage">
          <button id="vGrid" class="active" aria-label="Vue grille" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg>
          </button>
          <button id="vList" aria-label="Vue liste" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="activefilters" id="activefilters"></div>

    <div class="grid" id="grid"></div>

    <div class="empty" id="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M8 11h6" stroke-linecap="round"/></svg>
      <h3>Aucune API ne correspond</h3>
      <p>Essayez d'élargir votre recherche ou de réinitialiser les filtres.</p>
      <button id="resetEmpty">Réinitialiser les filtres</button>
    </div>
  </main>
</div>
<div class="overlay" id="overlay"></div>

<script>
/* ---------- icônes ---------- */
const I = {
  seo:'<path d="M3 17l5-5 4 3 6-7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="8" r="0"/><path d="M3 21h18" stroke-linecap="round" opacity=".5"/>',
  reviews:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z" stroke-linejoin="round"/>',
  stock:'<path d="M4 19V5M20 19H4" stroke-linecap="round"/><rect x="7" y="11" width="3" height="5" rx="1"/><rect x="13" y="7" width="3" height="9" rx="1"/>',
  test:'<path d="M9 3h6M10 3v6l-5 8.5A2 2 0 006.7 21h10.6a2 2 0 001.7-3.5L14 9V3" stroke-linejoin="round"/><path d="M8 15h8" stroke-linecap="round"/>',
  keyword:'<path d="M3 7.5l8-4.5 8 4.5v9l-8 4.5-8-4.5z" stroke-linejoin="round" opacity=".55"/><path d="M14 9.5a2.5 2.5 0 11-3.5 3.5L7 16.5" stroke-linecap="round" stroke-linejoin="round"/>',
  people:'<circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0111 0" stroke-linecap="round"/><path d="M16 5.5a3 3 0 010 5.5M17 14.5a5.5 5.5 0 013.5 5.5" stroke-linecap="round"/>',
  currency:'<path d="M4 9a8 8 0 0114-3M20 15A8 8 0 016 18" stroke-linecap="round"/><path d="M17 3v3.5h-3.5M7 21v-3.5h3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8v8M14 10.2c0-1-1-1.7-2.2-1.7s-2 .7-2 1.6c0 2.3 4.4 1.2 4.4 3.5 0 1-1 1.7-2.2 1.7s-2.2-.7-2.2-1.7" stroke-linecap="round"/>',
  phone:'<rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3" stroke-linecap="round"/><path d="M9 9.5l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>',
  pizza:'<path d="M12 3c5 0 9 3 9 3L12 21 3 6s4-3 9-3z" stroke-linejoin="round"/><circle cx="10" cy="9" r="1.1" fill="currentColor" stroke="none"/><circle cx="14" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r="1.1" fill="currentColor" stroke="none"/>'
};

/* ---------- catégories ---------- */
const CATS = {
  Administration:{tint:'var(--c-admin)',  d:'oklch(44% 0.035 262)', sh:'oklch(56% 0.035 262 /.35)', line:'oklch(56% 0.035 262 /.14)'},
  Finance:       {tint:'var(--c-finance)',d:'oklch(42% 0.09 158)',  sh:'oklch(54% 0.09 158 /.35)',  line:'oklch(54% 0.09 158 /.14)'},
  Marketing:     {tint:'var(--c-marketing)',d:'oklch(46% 0.13 30)', sh:'oklch(58% 0.13 30 /.35)',   line:'oklch(58% 0.13 30 /.14)'},
  Engineering:   {tint:'var(--c-eng)',     d:'oklch(43% 0.11 288)', sh:'oklch(55% 0.11 288 /.35)',  line:'oklch(55% 0.11 288 /.14)'}
};

/* ---------- données ---------- */
const APIS = [
  {name:'SEOAPI', icon:'seo', cat:'Marketing', ver:'1.0.0', ctx:'/seo', by:'admin', rating:5, recent:7,
   desc:"Audit on-page, suivi de positions et analyse de backlinks à la demande.", tags:['seo','marketing','temps-réel']},
  {name:'ReviewsAPI', icon:'reviews', cat:'Marketing', ver:'1.0.0', ctx:'/reviews', by:'admin', rating:4.5, recent:6,
   desc:"Collecte et agrégation d'avis clients depuis plusieurs sources.", tags:['avis','marketing']},
  {name:'StockAnalysisAPI', icon:'stock', cat:'Finance', ver:'1.0.0', ctx:'/stockAnalysis', by:'admin', rating:4, recent:5,
   desc:"Cours boursiers, indicateurs techniques et signaux en temps réel.", tags:['finance','temps-réel']},
  {name:'testAPI', icon:'test', cat:'Engineering', ver:'1.0', ctx:'/test', by:'admin', rating:3, recent:1,
   desc:"Bac à sable pour valider vos intégrations avant la mise en production.", tags:['sandbox','interne']},
  {name:'KeyWordResearchAPI', icon:'keyword', cat:'Marketing', ver:'1.0.0', ctx:'/keyword', by:'admin', rating:4.5, recent:4,
   desc:"Volume de recherche, difficulté et suggestions de mots-clés.", tags:['seo','mots-clés']},
  {name:'PeopleAPI', icon:'people', cat:'Administration', ver:'1.0.0', ctx:'/people', by:'admin', rating:4, recent:3,
   desc:"Annuaire, rôles et provisioning des utilisateurs de l'organisation.", tags:['identité','admin']},
  {name:'CurrencyConverterAPI', icon:'currency', cat:'Finance', ver:'1.0.0', ctx:'/currencyconv', by:'admin', rating:5, recent:8,
   desc:"Taux de change actualisés et conversion multidevise instantanée.", tags:['finance','devises']},
  {name:'PhoneVerification', icon:'phone', cat:'Administration', ver:'1.0', ctx:'/phoneverify', by:'admin', rating:4, recent:2,
   desc:"Vérification de numéros et envoi de codes OTP par SMS.", tags:['otp','identité']},
  {name:'PizzaShackAPI', icon:'pizza', cat:'Engineering', ver:'1.0.0', ctx:'/pizzashack', by:'Jane Roe', rating:4.5, recent:9,
   desc:"Commande, suivi de livraison et menu — l'API de démonstration.", tags:['pizza','démo']}
];

/* ---------- état ---------- */
const state = {q:'', cat:null, tag:null, sort:'popular', view:'grid'};
const subs = new Set();

const $ = s => document.querySelector(s);
const grid = $('#grid');

function stars(r){
  let h='';
  for(let i=1;i<=5;i++){
    const full = r>=i, half = !full && r>=i-0.5;
    h+=`<svg viewBox="0 0 24 24" class="${full||half?'star-f':'star-e'}" fill="${full?'currentColor':(half?'url(#hg)':'none')}" stroke="currentColor" stroke-width="1.4"><path d="M12 3.6l2.5 5 5.5.8-4 3.9.95 5.5L12 16.2 7.05 18.7 8 13.2l-4-3.9 5.5-.8z"/></svg>`;
  }
  return `<svg width="0" height="0"><defs><linearGradient id="hg"><stop offset="50%" stop-color="currentColor"/><stop offset="50%" stop-color="transparent"/></linearGradient></defs></svg>${h}`;
}

function buildCats(){
  const counts = {};
  APIS.forEach(a=>counts[a.cat]=(counts[a.cat]||0)+1);
  const el = $('#cats');
  el.innerHTML = `<button class="cat ${state.cat===null?'active':''}" data-cat="">
      <span class="dot" style="background:var(--accent)"></span><span class="clabel">Toutes les catégories</span>
      <span class="cnt">${APIS.length}</span></button>` +
    Object.keys(CATS).map(c=>`<button class="cat ${state.cat===c?'active':''}" data-cat="${c}">
      <span class="dot" style="background:${CATS[c].tint}"></span><span class="clabel">${c}</span>
      <span class="cnt">${counts[c]||0}</span></button>`).join('');
  el.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{
    state.cat = b.dataset.cat || null; closeNav(); render();
  });
}

function buildTags(){
  const set=new Set(); APIS.forEach(a=>a.tags.forEach(t=>set.add(t)));
  $('#tags').innerHTML=[...set].sort().map(t=>`<button class="tag ${state.tag===t?'active':''}" data-tag="${t}">${t}</button>`).join('');
  $('#tags').querySelectorAll('.tag').forEach(b=>b.onclick=()=>{
    state.tag = state.tag===b.dataset.tag ? null : b.dataset.tag; closeNav(); render();
  });
}

function filtered(){
  let list = APIS.filter(a=>{
    if(state.cat && a.cat!==state.cat) return false;
    if(state.tag && !a.tags.includes(state.tag)) return false;
    if(state.q){
      const q=state.q.toLowerCase();
      const hay=(a.name+' '+a.desc+' '+a.ctx+' '+a.cat+' '+a.tags.join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(state.sort==='alpha') list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(state.sort==='recent') list.sort((a,b)=>b.recent-a.recent);
  else list.sort((a,b)=>b.rating-a.rating || b.recent-a.recent);
  return list;
}

function card(a,i){
  const c=CATS[a.cat];
  const on=subs.has(a.name);
  const el=document.createElement('article');
  el.className='card';
  el.style.setProperty('--tint',c.tint);
  el.style.setProperty('--tint-d',c.d);
  el.style.setProperty('--tint-sh',c.sh);
  el.style.setProperty('--tint-line',c.line);
  el.innerHTML=`
    <div class="thumb">
      <span class="catbadge">${a.cat}</span>
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${I[a.icon]}</svg></span>
    </div>
    <div class="cbody">
      <div class="crow1">
        <span class="cname">${a.name}</span>
        <span class="stars" title="${a.rating}/5">${stars(a.rating)}</span>
      </div>
      <p class="cdesc">${a.desc}</p>
      <div class="cmeta">
        <span class="pill">v<b>${a.ver}</b></span>
        <span class="pill ctx">${a.ctx}</span>
      </div>
      <span class="cby">Par <b>${a.by}</b></span>
      <div class="cfoot">
        <div class="ctags">${a.tags.slice(0,2).map(t=>`<span class="ctag">${t}</span>`).join('')}</div>
        <button class="subbtn ${on?'on':''}" data-name="${a.name}">
          ${on
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12l4 4 10-11" stroke-linecap="round" stroke-linejoin="round"/></svg>Abonné'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>S\'abonner'}
        </button>
      </div>
    </div>`;
  el.querySelector('.subbtn').onclick=(e)=>{
    e.stopPropagation();
    const n=a.name;
    if(subs.has(n)) subs.delete(n); else subs.add(n);
    const same=grid.querySelectorAll(`.subbtn[data-name="${CSS.escape(n)}"]`);
    same.forEach(btn=>{
      const isOn=subs.has(n);
      btn.classList.toggle('on',isOn);
      btn.innerHTML=isOn
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12l4 4 10-11" stroke-linecap="round" stroke-linejoin="round"/></svg>Abonné'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>S\'abonner';
    });
  };
  requestAnimationFrame(()=>setTimeout(()=>el.classList.add('in'), Math.min(i,12)*45));
  return el;
}

function activeFilters(){
  const wrap=$('#activefilters'); wrap.innerHTML='';
  const chips=[];
  if(state.cat) chips.push(['cat',state.cat]);
  if(state.tag) chips.push(['tag','#'+state.tag]);
  if(state.q) chips.push(['q','« '+state.q+' »']);
  chips.forEach(([k,label])=>{
    const c=document.createElement('span'); c.className='chip';
    c.innerHTML=`${label}<button aria-label="Retirer">×</button>`;
    c.querySelector('button').onclick=()=>{
      if(k==='cat') state.cat=null;
      if(k==='tag') state.tag=null;
      if(k==='q'){ state.q=''; $('#search').value=''; }
      render();
    };
    wrap.appendChild(c);
  });
  if(chips.length>1){
    const b=document.createElement('button'); b.className='clearall'; b.textContent='Tout effacer';
    b.onclick=resetAll; wrap.appendChild(b);
  }
}

function resetAll(){
  state.q=''; state.cat=null; state.tag=null; $('#search').value=''; render();
}

function render(){
  const list=filtered();
  grid.innerHTML='';
  list.forEach((a,i)=>grid.appendChild(card(a,i)));
  $('#empty').classList.toggle('show', list.length===0);
  grid.style.display = list.length===0 ? 'none':'';
  const n=list.length, tot=APIS.length;
  $('#rescount').innerHTML = n===tot
    ? `<b>${tot}</b> APIs publiées`
    : `<b>${n}</b> résultat${n>1?'s':''} sur ${tot}`;
  buildCats(); buildTags(); activeFilters();
}

/* ---------- contrôles ---------- */
$('#search').addEventListener('input',e=>{state.q=e.target.value.trim();render();});
$('#sort').addEventListener('change',e=>{state.sort=e.target.value;render();});
$('#resetEmpty').onclick=resetAll;
$('#vGrid').onclick=()=>setView('grid');
$('#vList').onclick=()=>setView('list');
function setView(v){
  state.view=v;
  grid.classList.toggle('list',v==='list');
  $('#vGrid').classList.toggle('active',v==='grid'); $('#vGrid').setAttribute('aria-pressed',v==='grid');
  $('#vList').classList.toggle('active',v==='list'); $('#vList').setAttribute('aria-pressed',v==='list');
}

/* ---------- nav mobile ---------- */
function openNav(){document.body.classList.add('nav-open');}
function closeNav(){document.body.classList.remove('nav-open');}
$('#hamb').onclick=openNav; $('#closeRail').onclick=closeNav; $('#overlay').onclick=closeNav;

/* raccourci "/" pour la recherche */
document.addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#search').focus();}
  if(e.key==='Escape'){closeNav();}
});

render();
</script>
</body>
</html>
