name: CI
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    # Postgres for the DB-backed tests (billing, repos, migrations…). Without
    # DATABASE_URL those tests skip, which left e.g. internal/billing at 0%.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://portal:portal@localhost:5432/portal?sslmode=disable
      # Floor for total Go statement coverage (measured 67.3% when added).
      GO_COVERAGE_MIN: "66"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Go unit tests (with coverage)
        # -p 1: packages share one database and migrations take no lock, so
        # parallel packages could race applying them.
        run: go test ./internal/... ./cmd/... -p 1 -count=1 -coverprofile=coverage.out
      - name: Go coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "### Go coverage: ${total}% (floor ${GO_COVERAGE_MIN}%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" -v m="$GO_COVERAGE_MIN" 'BEGIN { if (t+0 < m+0) { printf "Go coverage %s%% is below the %s%% floor\n", t, m; exit 1 } }'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Web unit tests (with coverage)
        # Thresholds live in web/vite.config.ts; vitest fails the run below them.
        working-directory: web
        run: pnpm test:coverage
      - name: Web coverage summary
        if: always()
        working-directory: web
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e 'const t=require("./coverage/coverage-summary.json").total; console.log(`### Web coverage: statements ${t.statements.pct}% · branches ${t.branches.pct}% · functions ${t.functions.pct}% · lines ${t.lines.pct}%`)' >> "$GITHUB_STEP_SUMMARY"
      - name: Web typecheck
        working-directory: web
        run: pnpm exec tsc -b --force
      - name: Web build
        working-directory: web
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Start stack
        run: docker compose up -d
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U portal >/dev/null 2>&1; then echo ready; break; fi
            sleep 2
          done
      - name: Wait for APISIX admin
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-API-KEY: edd1c9f034335f136f87ad84b625c8f1" http://localhost:19180/apisix/admin/routes || true)
            if [ "$code" = "200" ]; then echo ready; break; fi
            sleep 2
          done
      - name: E2E
        run: PORTAL_ENV=dev UPSTREAM_ALLOW_PRIVATE=1 RUN_E2E=1 go test ./internal/e2e/... -count=1 -v
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
