# Isolated Postgres for the Playwright e2e suite. Kept separate from the main
# docker-compose.yml (and run under the `portal-e2e` compose project) so the test
# DB has its own volume and host port — the suite can `down -v` it for a pristine
# DB on every run without touching local dev data. Host port 5433 avoids the
# default 5432 a dev stack may already hold.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 1s
      timeout: 3s
      retries: 30
